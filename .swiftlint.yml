included:
  - AIview
  - AIviewTests
  - AIviewUITests

# These rules describe existing debt captured by the comprehensive review.
# Keep the list explicit: removing an entry ratchets the baseline forward.
disabled_rules:
  - comment_spacing
  - cyclomatic_complexity
  - file_length
  - force_cast
  - for_where
  - function_body_length
  - function_parameter_count
  - identifier_name
  - implicit_optional_initialization
  - large_tuple
  - line_length
  - non_optional_string_data_conversion
  - opening_brace
  - trailing_comma
  - trailing_whitespace
  - type_body_length

strict: true
reporter: xcode
